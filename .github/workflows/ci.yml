name: publication-safety-and-structure

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pip install -r requirements.txt
      - run: make check
      - run: python -m compileall -q benchmark_harness.py google_benchmark_harness.py tools analysis/scripts tests
      - run: make figures
      - run: test -s analysis/site_exports/benchmarkData.ts && test -s analysis/site_exports/exerciseProfiles.ts
      - run: git diff --exit-code -- paper/figures
