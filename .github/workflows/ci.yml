name: publication-safety-and-structure

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pip install -r requirements.txt
      - run: make check
      - name: Validate CITATION.cff
        uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: "--validate"
      - run: python -m compileall -q benchmark_harness.py google_benchmark_harness.py tools analysis/scripts tests
      - run: make figures
      - run: test -s analysis/site_exports/benchmarkData.ts && test -s analysis/site_exports/exerciseProfiles.ts && test -s analysis/site_exports/modelCatalog.ts
      - run: git diff --exit-code -- paper/figures
      - name: Install Tectonic
        uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: 0.15.0
      - name: Compile paper from a clean checkout
        run: make -C paper publication
      - run: test -s paper/benchmark_publication.pdf && pdfinfo paper/benchmark_publication.pdf | grep -q '^Pages:'
